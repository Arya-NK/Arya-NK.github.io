{% if site.disqus_shortname %}
    <script type="text/javascript">
        var disqus_shortname = '{{ site.disqus_shortname }}';
        var disqus_loaded = false;

        function loadDisqus() {
            if (disqus_loaded) return;
            disqus_loaded = true;

            var dsq = document.createElement('script');
            dsq.type = 'text/javascript';
            dsq.async = true;
            dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);

            var s = document.createElement('script');
            s.async = true;
            s.type = 'text/javascript';
            s.src = '//' + disqus_shortname + '.disqus.com/count.js';
            (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s);
        }

        // Load Disqus when user scrolls near comments or after 3 seconds
        var disqusObserver = new IntersectionObserver(function(entries) {
            if (entries[0].isIntersecting) {
                loadDisqus();
                disqusObserver.disconnect();
            }
        }, { rootMargin: '200px' });

        var disqusThread = document.getElementById('disqus_thread');
        if (disqusThread) {
            disqusObserver.observe(disqusThread);
        }

        // Fallback: load after 3 seconds if user hasn't scrolled
        setTimeout(loadDisqus, 3000);
    </script>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
{% endif %}
