<br>
<hr>
<span class="entry-tags">{% for tag in page.tags %}<a href="{{ '/tags/' | relative_url }}#{{ tag }}" title="Pages tagged {{ tag }}" class="tag"><span class="term">{{ tag }}</span></a>{% unless forloop.last %}{% endunless %}{% endfor %}</span>
<span class="social-share">
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url }}" title="Share on Facebook" class="tag">
        <span class="term"><i class="fa-brands fa-square-facebook"></i> Share</span>
    </a>
    <a href="https://twitter.com/intent/tweet?text={{ page.url | absolute_url }}" title="Share on Twitter" class="tag">
        <span class="term"><i class="fa-brands fa-square-x-twitter"></i> Tweet</span>
    </a>
    <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url }}" title="Share on LinkedIn" class="tag" >
            <span class="term"><i class="fa-brands fa-linkedin share-button"></i> linkedin</span>
    </a>
    <a href="mailto:?subject={{ page.title }}&amp;body=Check out this site {{ page.url | absolute_url }}" title="Share via Email" class="tag" >
            <span class="term"><i class="fa-solid fa-envelope share-button"></i> email</span>
    </a>
</span>
<div style="clear:both"></div>
